<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F1 Pitwall Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          let appearance = 'system';
          let guestAppearance = null;
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && key.startsWith('f1_prefs_')) {
              try {
                const prefs = JSON.parse(localStorage.getItem(key));
                if (prefs && (prefs.appearance || prefs.theme)) {
                  if (key === 'f1_prefs_guest') {
                    guestAppearance = prefs.appearance || prefs.theme;
                  } else {
                    appearance = prefs.appearance || prefs.theme;
                    break;
                  }
                }
              } catch (e) {}
            }
          }
          if (appearance === 'system' && guestAppearance) {
            appearance = guestAppearance;
          }
          
          let activeTheme = appearance;
          if (activeTheme === 'system') {
            const systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            activeTheme = systemIsDark ? 'dark' : 'light';
          }
          document.documentElement.classList.add('theme-' + activeTheme);
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
